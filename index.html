<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Name-Card</title>
    <link rel="stylesheet" href="stylesheet.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">
</head>
<body>
    <div class="pagecontainer">
        <div class="thecard">
            <div class="blueheader">
              
                
            </div>

              <div class="myimage">
                    <img src="images/Neon Gamer Portrait with Headphones.png" alt="profile picture">
                </div>
                <div class="namebio">
                    <h3>amaan_gaming00</h3>
                    <p>gamer & content creator</p>
                </div>

                <div class="sociallinks">
                    <a href="https://www.instagram.com/amaan_gaming00/">
                    <img src="images/ig logo2. jpg.jpg" alt="">
                    </a>

                    <img src="images/fb logo.jpg" alt="">

                    <div class="youtubelogo">
                      <a href="https://www.youtube.com/@AmaanKhan-ow1hw">
                    <img src="images/yt logo.jpg" alt="">
                    </a>
                </div>

                </div>

                <div class="buttons">
                    <button>Subscribe</button>
                    <button>Message</button>
                </div>

                <div class="engagestats">
                    <div class="likes">
                          <i class="fa-regular fa-heart"> 60k</i>
                    </div>

                    <div class="comments">
                        <i class="fa-regular fa-comment"> 30k</i>
                    </div>

                    <div class="shares">
                        <i class="fa-sharp fa-regular fa-share-from-square"> 12k</i>
                    </div>
                </div>

                

            
        </div>
    </div>
    
</body>
</html>
